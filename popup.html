<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Takeout for AI Chats</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <svg hidden aria-hidden="true" focusable="false">
    <symbol id="i-user-check" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m16 11 2 2 4-4"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
    <symbol id="i-window" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 8h20"/><path d="M6 4v4"/><path d="M10 4v4"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
    <symbol id="i-circle-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></symbol>
  </svg>
  <main>
    <header class="brand"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" class="mark-bg"/><path class="mark-fg" d="M12 5.5v8M8.5 10.5 12 14l3.5-3.5M6.5 17.5h11"/></svg><span>Takeout for AI Chats</span></header>

    <section class="status">
      <span id="tick" class="tick" hidden><svg class="icon icon-lg" aria-hidden="true"><use href="#i-check"/></svg></span>
      <h1 id="title"></h1>
      <p id="line" class="muted small" hidden></p>

      <div id="banner" class="banner" data-tone="warning" role="status" hidden>
        <svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg>
        <p id="banner-text"></p>
      </div>

      <div id="progress" class="progress" hidden>
        <p class="progress-head"><span id="pct" class="pct num"></span><span id="progress-label" class="small muted" aria-live="polite"></span></p>
        <div id="bar" class="bar" role="progressbar" aria-label="Export progress" aria-valuemin="0" aria-valuemax="100"><div class="bar-fill"></div></div>
        <dl class="stats">
          <div><dt>Saved</dt><dd id="count-saved">0</dd></div>
          <div><dt>Files</dt><dd id="count-files">0</dd></div>
          <div id="stat-failed" class="stat-failed"><dt>Failed</dt><dd id="count-failed">0</dd></div>
        </dl>
      </div>
    </section>

    <p id="notice" class="notice small" role="status" hidden></p>

    <div class="actions">
      <div id="primary-slot"></div>
      <div id="secondary-slot" class="secondary"></div>
    </div>

    <footer>
      <a id="privacy" class="small" href="exporter.html"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-shield"/></svg>Stays on your computer</a>
    </footer>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
